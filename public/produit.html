<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1b3f">
  <title>Chargement… · Onze</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b1b3f'/%3E%3Ctext x='50' y='68' font-family='system-ui,sans-serif' font-size='60' font-weight='800' fill='%23f97316' text-anchor='middle'%3E11%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="brand">
        <div class="brand-logo">11</div>
        <div class="brand-text">
          <div class="brand-name" data-shop-name>Onze</div>
          <div class="brand-tag" data-shop-tagline>Le vestiaire des passionnés</div>
        </div>
      </a>
      <nav class="nav">
        <a href="/">Boutique</a>
        <a href="/admin">Admin</a>
        <button class="cart-btn" id="cartBtn" aria-label="Voir le panier">
          Panier
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    <a href="/" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Retour à la boutique
    </a>
    <div id="productContainer"></div>
    <div id="relatedContainer"></div>
  </main>

  <footer class="footer">
    <p><strong data-shop-name>Onze</strong> — <span data-shop-tagline>Le vestiaire des passionnés</span></p>
    <p>© <span id="year"></span> · <a href="/admin">Espace vendeur</a></p>
  </footer>

  <!-- Cart / Checkout / Confirmation modals (shared with home page) -->
  <div class="modal-overlay" id="cartModal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <h3>Votre panier</h3>
        <button class="icon-btn" data-close aria-label="Fermer">×</button>
      </div>
      <div class="modal-body"><div id="cartBody"></div></div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-close>Continuer</button>
        <button class="btn btn-primary" id="goCheckout" disabled>Commander</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="checkoutModal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <h3>Finaliser la commande</h3>
        <button class="icon-btn" data-close aria-label="Fermer">×</button>
      </div>
      <form id="checkoutForm">
        <div class="modal-body">
          <div class="field">
            <label for="cName">Votre nom</label>
            <input id="cName" name="name" required autocomplete="name">
          </div>
          <div class="field">
            <label for="cContact">Email ou téléphone</label>
            <input id="cContact" name="contact" required autocomplete="email">
          </div>
          <div class="field">
            <label for="cAddress">Adresse de livraison</label>
            <textarea id="cAddress" name="address" rows="2" required autocomplete="street-address"></textarea>
          </div>
          <div class="field">
            <label for="cNote">Message (optionnel)</label>
            <textarea id="cNote" name="note" rows="2"></textarea>
          </div>
          <div class="cart-total">
            <span>Total</span>
            <span id="checkoutTotal">0 €</span>
          </div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-secondary" data-close>Retour</button>
          <button type="submit" class="btn btn-primary">Valider la commande</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modal-head">
        <h3>Commande envoyée !</h3>
        <button class="icon-btn" data-close aria-label="Fermer">×</button>
      </div>
      <div class="modal-body">
        <p>Merci pour votre confiance. Nous avons bien reçu votre commande <strong id="confirmId"></strong>.</p>
        <div id="contactOptions"></div>
      </div>
      <div class="modal-foot">
        <a href="/" class="btn btn-primary btn-block">Retour à la boutique</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/produit.js"></script>
</body>
</html>
