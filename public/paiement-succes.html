<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1b3f">
  <title>Paiement confirmé · Onze</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/png" href="/img/favicon.png">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="brand">
        <img class="brand-logo-img" src="/img/logo-dark.png" alt="Onze">
        <span class="brand-tag">Le vestiaire des passionnés</span>
      </a>
    </div>
  </header>

  <main class="container" style="min-height:60vh">
    <div class="result-page" id="resultPage">
      <div class="result-icon pending">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="6" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <h1>Vérification du paiement…</h1>
      <p>Merci de patienter quelques secondes.</p>
    </div>
  </main>

  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const sessionId = params.get('session_id');
      const page = document.getElementById('resultPage');

      function render(state, data) {
        if (state === 'paid') {
          const shortId = (data.orderId || '').slice(0, 6).toUpperCase();
          page.innerHTML = `
            <div class="result-icon success">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            </div>
            <h1>Paiement confirmé !</h1>
            <p>Merci pour ta commande. On prépare ton maillot et on te tient au courant de l'expédition.</p>
            <div class="result-order">
              <span>Commande</span>
              <strong>#${shortId}</strong>
            </div>
            ${data.amount != null ? `<div class="result-order"><span>Montant réglé</span><strong>${new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(data.amount)}</strong></div>` : ''}
            <a href="/" class="btn btn-primary btn-block" style="margin-top:20px">Retour à la boutique</a>
          `;
          try { localStorage.removeItem('onze.cart'); } catch {}
        } else if (state === 'pending') {
          page.innerHTML = `
            <div class="result-icon pending">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <h1>Paiement en cours de traitement</h1>
            <p>Ta banque valide encore l'opération. Tu recevras une confirmation dès qu'elle est finalisée.</p>
            <a href="/" class="btn btn-primary btn-block">Retour à la boutique</a>
          `;
        } else {
          page.innerHTML = `
            <div class="result-icon cancel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </div>
            <h1>Erreur de vérification</h1>
            <p>Impossible de confirmer le paiement. Contacte-nous si le montant a été débité.</p>
            <a href="/" class="btn btn-primary btn-block">Retour à la boutique</a>
          `;
        }
      }

      if (!sessionId) return render('error');

      try {
        const r = await fetch('/api/pay/stripe/verify?session_id=' + encodeURIComponent(sessionId));
        if (!r.ok) throw new Error();
        const data = await r.json();
        if (data.paymentStatus === 'paid') render('paid', data);
        else if (data.paymentStatus === 'unpaid') render('pending', data);
        else render('pending', data);
      } catch {
        render('error');
      }
    })();
  </script>
</body>
</html>
